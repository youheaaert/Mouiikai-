<style>
/* Layout: first-person horror — status strip, low-res raycast viewport (pixelated), control bar. Committed pitch-dark look, single theme. */
:root{
  --void:#060607;      /* page ground */
  --soot:#121214;      /* bars, overlays */
  --chalk:#d9d6cc;     /* text, old chalk */
  --ash:#7d7a73;       /* secondary */
  --blood:#a3221c;     /* danger accent */
  --brass:#c9a85a;     /* keys, items */
  --f-display:"Yuji Syuku","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--void);color:var(--chalk);font-family:var(--f-body);font-size:15px;line-height:1.8;overflow:hidden;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{height:100%;max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding-block:8px;box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

.hud{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;font-size:.8rem;color:var(--ash);font-variant-numeric:tabular-nums}
.hud .obj{flex:1 1 220px;min-width:0;display:flex;gap:8px;align-items:baseline}
.hud .stg{font-family:var(--f-display);color:var(--chalk);font-size:.95rem;white-space:nowrap}
#obj{color:var(--chalk);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meters{display:flex;align-items:center;gap:10px}
.meters b{color:var(--brass);font-weight:700}
.stam{width:70px;height:4px;background:rgba(217,214,204,.1);border-radius:2px;overflow:hidden}
.stam i{display:block;height:100%;background:var(--chalk);width:100%}
.stam.low i{background:var(--blood)}
#mute{background:none;border:1px solid rgba(217,214,204,.2);border-radius:6px;padding:0 8px;font-size:.75rem;color:var(--ash)}

#stage{position:relative;flex:1 1 auto;min-height:220px;border-radius:6px;overflow:hidden;background:#000;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#map{position:absolute;right:10px;top:10px;width:min(46%,300px);border:1px solid rgba(217,214,204,.25);border-radius:4px;background:rgba(6,6,7,.85);pointer-events:none}
#inv{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:4px;font-size:.75rem;pointer-events:none}
#inv span{background:rgba(18,18,20,.7);border:1px solid rgba(201,168,90,.4);color:var(--brass);padding:0 8px;border-radius:3px;width:max-content}
#whisper{position:absolute;left:0;right:0;top:16%;text-align:center;font-family:var(--f-display);font-size:clamp(1.3rem,5vw,2rem);color:var(--chalk);opacity:0;transition:opacity 1.6s;pointer-events:none;letter-spacing:.2em;text-shadow:0 0 12px #000;padding:0 12px}
#whisper.on{opacity:.8}
#toast{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);background:rgba(18,18,20,.88);padding:4px 14px;border-radius:4px;font-size:.85rem;opacity:0;transition:opacity .4s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1}
#prompt{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font-size:.8rem;color:var(--brass);pointer-events:none;white-space:nowrap;text-shadow:0 0 6px #000}
#cross{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:rgba(217,214,204,.35);pointer-events:none}
#touchhint{position:absolute;inset:auto 0 30% 0;display:flex;justify-content:space-around;font-size:.8rem;color:var(--ash);pointer-events:none;transition:opacity 1s}

.bar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pad{border:1px solid rgba(217,214,204,.25);background:var(--soot);border-radius:8px;padding:12px 4px;font-weight:700;touch-action:none;font-size:.9rem}
.pad.active{border-color:var(--brass);color:var(--brass)}
.pad.held{background:rgba(217,214,204,.12)}
.keys-hint{font-size:.72rem;color:var(--ash);text-align:center}
@media (pointer:coarse){.keys-hint{display:none}}
@media (pointer:fine){#touchhint{display:none}}

#ov{position:absolute;inset:0;background:rgba(4,4,5,.86);display:flex;flex-direction:column;justify-content:center;gap:16px;padding:24px max(24px,env(safe-area-inset-left,0px));z-index:5;overflow-y:auto}
#ov[hidden]{display:none!important}
#ov h1{font-family:var(--f-display);font-weight:400;font-size:clamp(2.6rem,12vw,4.6rem);margin:0;letter-spacing:.18em;line-height:1.1}
#ov h1 span{color:var(--blood)}
#ov h2{font-family:var(--f-display);font-weight:400;font-size:clamp(1.8rem,8vw,2.8rem);margin:0;letter-spacing:.2em}
#ov .kicker{font-size:.75rem;letter-spacing:.3em;color:var(--ash)}
#ov p{margin:0;max-width:34em;font-size:1rem;white-space:pre-wrap}
#ov p.big{font-family:var(--f-display);font-size:clamp(1.25rem,5vw,1.8rem);line-height:1.6}
#ov .red{color:var(--blood)}
#ov .ctrl{font-size:.85rem;color:var(--ash);display:grid;grid-template-columns:auto 1fr;gap:2px 14px;margin:0}
#ov .ctrl dt{color:var(--chalk);font-weight:700}
#ov .ctrl dd{margin:0}
#ov .row{display:flex;gap:10px;flex-wrap:wrap}
.go{background:none;border:1px solid var(--chalk);border-radius:4px;padding:10px 22px;font-weight:700;letter-spacing:.1em}
.go.red{border-color:var(--blood);color:var(--blood)}
.tapnote{font-size:.75rem;color:var(--ash)}
.code{font-family:var(--f-display);font-size:2.2rem;letter-spacing:.5em;color:var(--brass)}
.code.bad{color:var(--blood);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.keypad{display:grid;grid-template-columns:repeat(3,64px);gap:8px}
.keypad button{background:var(--soot);border:1px solid rgba(217,214,204,.3);border-radius:6px;padding:10px 0;font-size:1.2rem}
#scare{position:fixed;inset:0;width:100vw;height:100vh;z-index:50;pointer-events:none;display:none;background:#000}
#scare.on{display:block}
@media (prefers-reduced-motion:reduce){#whisper,#toast{transition:none}.code.bad{animation:none}}
</style>
</head>

function toTex(c,emis){const g=c.getContext('2d'),d=g.getImageData(0,0,c.width,c.height).data,n=c.width*c.height;
  const t={w:c.width,h:c.height,r:new Uint8Array(n),g:new Uint8Array(n),b:new Uint8Array(n),a:new Uint8Array(n),e:new Uint8Array(n)};

    c.fillStyle='rgba(6,0,0,.95)';c.beginPath();c.arc(ex+s*R*.02,ey+R*(.15+dl),R*.035,0,7);c.fill();
    c.lineWidth=Math.max(.8,R*.022);c.beginPath();c.moveTo(ex-s*R*.07,ey+R*.12);c.lineTo(ex-s*R*.09,ey+R*(s<0?.3:.42));c.stroke();

const WALL={'#':1,W:1,K:1,H:1,R:1,F:1,L:1,D:1,A:1,B:1,X:1};
let S,grid,items,desks,P,M,inv,flags,game,explored,stageIdx=0,checkpoint=null;
const cell=(x,y)=>(grid[y]&&grid[y][x])||'#';
const solidP=(x,y)=>{const c=cell(x,y);return !!WALL[c]||c==='T';};
const passM=(x,y)=>{const c=cell(x,y);return c==='.'||c==='d'||c==='D';};
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const angDiff=(a,b)=>{let d=a-b;return Math.atan2(Math.sin(d),Math.cos(d));};

function loadStage(i,keepInv){
  stageIdx=i;S=STAGES[i];grid=S.map.map(r=>r.split(''));
  items=S.items.map((it,k)=>Object.assign({id:i+'-'+k,taken:false},it));
  desks=[];for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)if(grid[y][x]==='T')desks.push({x:x+.5,y:y+.5,tex:'desk',h:.55,lift:0});
  P={x:S.start[0],y:S.start[1],a:S.start[2],stam:1,bat:keepInv?Math.max(60,P.bat):100,light:true,hidden:null,phase:0,bob:0,stepT:0};
  M={x:S.oni[0],y:S.oni[1],face:Math.PI/2,state:'dormant',path:[],target:null,pause:0,repath:0,lost:0,sawT:-9,last:null,lockerT:false,step:0,hunt:0};
  inv=keepInv?{mio:inv.mio,fuse:0}:{mio:0,fuse:0};
  flags={};explored=new Uint8Array(MW*MH);
  game={t:0,paused:true,over:false,whisperT:18,shake:0,near:99,flicker:0,ghost:null,ghostDone:false,chasedOnce:false,dormantT:7,flash:0};
  $('#stg').textContent=S.title+(S.sub?'　'+S.sub:'');
  saveCheckpoint();
}
function saveCheckpoint(){checkpoint=JSON.stringify({stageIdx,grid,items,inv,flags,P:{x:P.x,y:P.y,a:P.a,bat:P.bat},explored:Array.from(explored)});}
function loadCheckpoint(){
  const c=JSON.parse(checkpoint);stageIdx=c.stageIdx;S=STAGES[stageIdx];grid=c.grid;items=c.items;inv=c.inv;flags=c.flags;explored=Uint8Array.from(c.explored);
  P={x:c.P.x,y:c.P.y,a:c.P.a,stam:1,bat:Math.max(c.P.bat,40),light:true,hidden:null,phase:0,bob:0,stepT:0};
  // put oni far away
  let best=null,bd=-1;for(let y=1;y<MH-1;y++)for(let x=1;x<MW-1;x++)if(passM(x,y)){const d=Math.hypot(x+.5-P.x,y+.5-P.y);if(d>bd){bd=d;best=[x,y];}}
  M={x:best[0]+.5,y:best[1]+.5,face:0,state:'wander',path:[],target:null,pause:2,repath:0,lost:0,sawT:-9,last:null,lockerT:false,step:0,hunt:0};
  game={t:0,paused:false,over:false,whisperT:12,shake:0,near:99,flicker:0,ghost:null,ghostDone:true,chasedOnce:true,dormantT:0,flash:0};
}

let A=null,muted=false,beatT=0;
function audioInit(){if(A)return;try{const ac=new (window.AudioContext||window.webkitAudioContext)();const master=ac.createGain();master.gain.value=muted?0:1;master.connect(ac.destination);
  const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=170;const dg=ac.createGain();dg.gain.value=.06;lp.connect(dg);dg.connect(master);
  [55,58.3,82.4].forEach(f=>{const o=ac.createOscillator();o.type='sawtooth';o.frequency.value=f;o.connect(lp);o.start();});
  A={ac,master,droneGain:dg};}catch(e){A=null;}}
function outNode(pan){if(!A)return null;if(pan&&A.ac.createStereoPanner){const p=A.ac.createStereoPanner();p.pan.value=Math.max(-1,Math.min(1,pan));p.connect(A.master);return p;}return A.master;}
function blip(freq,dur,vol,type,slide,pan){if(!A||vol<=.001)return;const ac=A.ac,o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.value=freq;if(slide)o.frequency.exponentialRampToValueAtTime(slide,ac.currentTime+dur);
  g.gain.setValueAtTime(vol,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+dur);o.connect(g);g.connect(outNode(pan));o.start();o.stop(ac.currentTime+dur+.05);}
function noise(dur,vol,fc,pan){if(!A||vol<=.001)return;const ac=A.ac,b=ac.createBuffer(1,Math.max(1,ac.sampleRate*dur|0),ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
  const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();f.type='bandpass';f.frequency.value=fc||800;g.gain.value=vol;s.buffer=b;s.connect(f);f.connect(g);g.connect(outNode(pan));s.start();}
const panOf=(x,y)=>Math.sin(angDiff(Math.atan2(y-P.y,x-P.x),P.a));
const volOf=(x,y,k)=>Math.max(0,(k||1)*(1-Math.hypot(x-P.x,y-P.y)/14));
const heart=v=>{blip(62,.18,v,'sine',40);setTimeout(()=>blip(55,.2,v*.8,'sine',38),180);};
const stinger=()=>{blip(220,1.4,.22,'sawtooth',110);blip(233,1.4,.18,'sawtooth',116);noise(.8,.45,1200);};
const pickup=()=>{blip(1320,.6,.1,'triangle');blip(1980,.8,.05,'triangle');};
const doorSnd=(x,y)=>noise(.5,.35*volOf(x,y,1.2),380,panOf(x,y));
const giggle=(x,y)=>{const p=panOf(x,y);[1250,1480,1180,1400].forEach((f,i)=>setTimeout(()=>blip(f,.12,.05,'triangle',f*.9,p),i*110));};
function piano(x,y){const notes=[440,392,440,523,494,440,392,330];notes.forEach((f,i)=>setTimeout(()=>{const p=panOf(x,y),v=.14*Math.max(.25,volOf(x,y,1.3));blip(f,1.6,v,'triangle',null,p);blip(f*2,1,v*.25,'sine',null,p);},i*520));}

    if(M.state==='chase'&&game.t-M.sawT<.9&&dist(M,P)<6){M.lockerT=true;}
    P.x=x+.5;P.y=y+.5;P.a=face;noise(.3,.14,1500);blip(300,.1,.06,'square');toast('ロッカーに隠れた……息を殺して');return;}

/* =========================================================
   ONI AI
   ========================================================= */
function los(a,b){const d=Math.hypot(a.x-b.x,a.y-b.y),n=Math.ceil(d/.15);for(let i=1;i<n;i++){const x=a.x+(b.x-a.x)*i/n,y=a.y+(b.y-a.y)*i/n;if(WALL[cell(Math.floor(x),Math.floor(y))])return false;}return true;}
function bfs(sx,sy,tx,ty){
  if(!passM(tx,ty))return [];
  const prev=new Int32Array(MW*MH).fill(-1),q=[sy*MW+sx];let h=0;prev[sy*MW+sx]=sy*MW+sx;
  while(h<q.length){const c=q[h++];if(c===ty*MW+tx)break;const x=c%MW,y=(c/MW)|0;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,ni=ny*MW+nx;if(nx>=0&&ny>=0&&nx<MW&&ny<MH&&passM(nx,ny)&&prev[ni]<0){prev[ni]=c;q.push(ni);}}}

  const path=[];let c=ty*MW+tx;while(c!==sy*MW+sx){path.unshift([c%MW,(c/MW)|0]);c=prev[c];}return path;}
function wanderTarget(){const near=Math.random()<.45+.15*M.hunt;for(let k=0;k<200;k++){let x,y;
  if(near){x=Math.floor(P.x+(Math.random()-.5)*14);y=Math.floor(P.y+(Math.random()-.5)*10);}else{x=1+Math.floor(Math.random()*(MW-2));y=1+Math.floor(Math.random()*(MH-2));}
  if(x>0&&y>0&&x<MW&&y<MH&&passM(x,y)&&Math.hypot(x-M.x,y-M.y)>4)return [x,y];}return [Math.floor(M.x),Math.floor(M.y)];}
function oniSees(){
  if(P.hidden)return false;const d=dist(M,P);const range=P.light?10.5:4.2;if(d>range)return false;if(!los(M,P))return false;
  if(d<2.4)return true;const toP=Math.atan2(P.y-M.y,P.x-M.x);if(Math.abs(angDiff(M.face,toP))<1.0)return true;
  if(P.light&&d<9&&Math.abs(angDiff(P.a,toP+Math.PI))<.32)return true; // flashlight shone on it
  return false;}
function updateOni(dt){
  if(M.state==='dormant'){game.dormantT-=dt;if(game.dormantT<=0){M.state='wander';M.pause=.5;whisper('もういいかい');}return;}
  const d=dist(M,P);game.near=d;const [tx,ty]=[Math.floor(P.x),Math.floor(P.y)];
  const see=oniSees();
  if(see){if(M.state!=='chase'){M.state='chase';M.path=[];game.shake=.6;stinger();whisper(game.chasedOnce?(Math.random()<.5?'まてぇ……':'にげないで'):'みぃつけた');game.chasedOnce=true;}
    M.lost=0;M.sawT=game.t;M.last=[tx,ty];}
  if(M.state==='chase'&&!see&&!M.lockerT){M.lost+=dt;if(M.lost>2.6){M.state='search';M.target=M.last||[tx,ty];M.path=[];}}
  if(M.state!=='chase'&&!P.hidden&&d<3.2&&los(M,P)&&P.light===false&&Math.random()<dt*.6){M.face=Math.atan2(P.y-M.y,P.x-M.x);}
  const base=S.speed;let speed=1.45*base;
  if(M.state==='chase'){speed=(2.75+.35*M.hunt)*base;M.repath-=dt;
    if(M.repath<=0||!M.path.length){M.repath=.3;const g=M.lockerT&&P.hidden?[Math.floor(P.hidden.px),Math.floor(P.hidden.py)]:(see?[tx,ty]:M.last);const [mx,my]=[Math.floor(M.x),Math.floor(M.y)];M.path=bfs(mx,my,g[0],g[1]);}}
  else if(M.state==='search'){speed=2.2*base;if(!M.path.length){const [mx,my]=[Math.floor(M.x),Math.floor(M.y)];
    if(!M.target||(mx===M.target[0]&&my===M.target[1])){M.state='wander';M.pause=2.2;M.target=null;if(P.hidden&&d<3)whisper('……どこ？');}
    else{M.path=bfs(mx,my,M.target[0],M.target[1]);if(!M.path.length){M.state='wander';M.target=null;}}}}
  else{if(M.pause>0){M.pause-=dt;M.face+=Math.sin(game.t*1.7)*dt*1.2;}
    else if(!M.path.length){if(M.target){M.target=null;M.pause=.8+Math.random()*1.6;}else{M.target=wanderTarget();M.path=bfs(Math.floor(M.x),Math.floor(M.y),M.target[0],M.target[1]);}}}
  if(M.path.length&&!(M.state==='wander'&&M.pause>0)){
    const [nx,ny]=M.path[0];if(grid[ny][nx]==='D'){grid[ny][nx]='d';doorSnd(nx+.5,ny+.5);}
    const gx=nx+.5,gy=ny+.5,dx=gx-M.x,dy=gy-M.y,l=Math.hypot(dx,dy),st=speed*dt;
    if(l<=st){M.x=gx;M.y=gy;M.path.shift();}else{M.x+=dx/l*st;M.y+=dy/l*st;const fa=Math.atan2(dy,dx);M.face+=angDiff(fa,M.face)*Math.min(1,dt*8);}
    M.step-=dt;if(M.step<=0){M.step=M.state==='chase'?.3:.56;const v=volOf(M.x,M.y,.55);noise(.09,v,240,panOf(M.x,M.y));blip(52,.12,v*.5,'sine',40,panOf(M.x,M.y));}
  }
  if(!P.hidden&&d<.6)return caught();
  if(P.hidden&&M.lockerT&&Math.hypot(M.x-P.hidden.px,M.y-P.hidden.py)<.7)return caught(true);
  if(P.hidden&&M.lockerT&&M.state!=='chase')M.lockerT=false;
  if(d<11&&!game.over){beatT-=dt;if(beatT<=0){beatT=Math.max(.36,d/9);heart(Math.min(.85,1.4/(d+.5)));}}
}

/* =========================================================
   PLAYER
   ========================================================= */
function updatePlayer(dt){
  let f=0,s=0,turn=0;
  if(keys.has('w')||keys.has('arrowup'))f++;if(keys.has('s')||keys.has('arrowdown'))f--;
  if(keys.has('d'))s++;if(keys.has('a'))s--;
  if(keys.has('arrowleft'))turn--;if(keys.has('arrowright'))turn++;
  if(joy){const m=Math.hypot(joy.dx,joy.dy);if(m>.12){f=-joy.dy;s=joy.dx;}}
  if(turn)turnBy(turn*2.4*dt);
  const mag=Math.min(1,Math.hypot(f,s));
  const wantRun=runHeld||keys.has('shift');P.running=false;
  if(!P.hidden&&mag>.05){
    let sp=2.3;if(wantRun&&P.stam>.02&&f>0){sp=3.9;P.running=true;P.stam=Math.max(0,P.stam-dt/3);}
    const ca=Math.cos(P.a),sa=Math.sin(P.a),n=Math.hypot(f,s);
    const vx=(ca*f-sa*s)/n*sp*mag*dt,vy=(sa*f+ca*s)/n*sp*mag*dt,r=.24;
    const free=(x,y)=>!solidP(Math.floor(x-r),Math.floor(y-r))&&!solidP(Math.floor(x+r),Math.floor(y-r))&&!solidP(Math.floor(x-r),Math.floor(y+r))&&!solidP(Math.floor(x+r),Math.floor(y+r));
    if(free(P.x+vx,P.y))P.x+=vx;if(free(P.x,P.y+vy))P.y+=vy;
    P.phase+=dt*sp*2.6;const step=Math.floor(P.phase/Math.PI);if(step!==P.stepT){P.stepT=step;noise(.05,P.running?.09:.035,900);emit(P.x,P.y,P.running?8:2.2);}
  }
  if(!P.running)P.stam=Math.min(1,P.stam+dt*(P.hidden?.35:.2));
  if(P.stam<.15&&Math.random()<dt*1.5)noise(.4,.04,600);
  P.bob=reduceMotion?0:Math.sin(P.phase)*(P.running?2.4:1.3);
  // battery
  if(P.light){P.bat-=dt*100/150;if(P.bat<=0){P.bat=0;P.light=false;toast('電池が切れた……');}}
  // explored
  const px=Math.floor(P.x),py=Math.floor(P.y);for(let y=py-1;y<=py+1;y++)for(let x=px-1;x<=px+1;x++)if(x>=0&&y>=0&&x<MW&&y<MH)explored[y*MW+x]=1;
  pickItems();
  // ghost event
  if(S.ghost&&!game.ghostDone&&!game.ghost&&M.state!=='chase'&&S.ghost.when(P)){game.ghost={x:S.ghost.at[0],y:S.ghost.at[1],t:0};whisper('こっちだよ');}
  if(game.ghost){game.ghost.t+=dt;if(dist(game.ghost,P)<6||game.ghost.t>3.5){giggle(game.ghost.x,game.ghost.y);game.ghost=null;game.ghostDone=true;}}
}

const ctx=cv.getContext('2d');

function resize(){

  img=ctx.createImageData(RW,RH);buf=new Uint32Array(img.data.buffer);zbuf=new Float32Array(RW);

function texFor(c,x,y){switch(c){case 'W':return ((x*7+y*13)%5===0)?TX.windowHand:TX.window;case 'K':return TX.board;case 'H':return TX.shelf;case 'R':return TX.curtain;case 'F':return TX.fuse;case 'L':return TX.locker;case 'D':return TX.door;

let gOff=0;
function render(){

  const hor=Math.round(RH/2+P.bob+shake);
  // lighting
  let fl=0;if(P.light){fl=1;if(P.bat<15&&Math.random()<.12)fl=.2+Math.random()*.4;if(game.near<5&&Math.random()<.16)fl=.15+Math.random()*.5;if(game.flicker>0&&Math.random()<.5)fl=Math.random()*.3;}
  let amb=S.amb;if(game.flash>0)amb+=game.flash*2.2;
  gOff=(gOff+977)&4095;
  const ftex=TX[S.floor],ctex=TX.ceil;
  const rdx0=dirX-plX,rdy0=dirY-plY,rdx1=dirX+plX,rdy1=dirY+plY;
  for(let y=0;y<RH;y++){
    const isFloor=y>hor,p=isFloor?y-hor:hor-y;let i=y*RW;
    if(p===0){for(let x=0;x<RW;x++)buf[i++]=0xff000000;continue;}
    const rowD=(.5*F)/p,stX=rowD*(rdx1-rdx0)/RW,stY=rowD*(rdy1-rdy0)/RW;let fx=P.x+rowD*rdx0,fy=P.y+rowD*rdy0;
    const T=isFloor?ftex:ctex,aw=amb/(1+rowD*.45)*(isFloor?1:.8),fw=fl*1.75/(1+rowD*rowD*.1)*(isFloor?1:.75);
    for(let x=0;x<RW;x++){const tx=((fx-Math.floor(fx))*64)|0,ty=((fy-Math.floor(fy))*64)|0,id=(ty<<6)|tx;put(i,T.r[id],T.g[id],T.b[id],aw,fw*cone[i]);fx+=stX;fy+=stY;i++;}
  }
  const lim=P.light?7:3;
  for(let x=0;x<RW;x++){
    const camX=2*x/RW-1,rdx=dirX+plX*camX,rdy=dirY+plY*camX;
    let mx=Math.floor(P.x),my=Math.floor(P.y);const ddx=Math.abs(1/rdx),ddy=Math.abs(1/rdy);
    let stepX,stepY,sdx,sdy,side=0,c='#';
    if(rdx<0){stepX=-1;sdx=(P.x-mx)*ddx;}else{stepX=1;sdx=(mx+1-P.x)*ddx;}
    if(rdy<0){stepY=-1;sdy=(P.y-my)*ddy;}else{stepY=1;sdy=(my+1-P.y)*ddy;}
    for(let n=0;n<64;n++){if(sdx<sdy){sdx+=ddx;mx+=stepX;side=0;}else{sdy+=ddy;my+=stepY;side=1;}c=cell(mx,my);if(WALL[c])break;}
    const perp=Math.max(.05,side===0?sdx-ddx:sdy-ddy);zbuf[x]=perp;
    if(perp<lim&&mx>=0&&my>=0&&mx<MW&&my<MH)explored[my*MW+mx]=1;
    const lineH=F/perp,ds=hor-lineH/2;const y0=Math.max(0,Math.floor(ds)),y1=Math.min(RH-1,Math.floor(ds+lineH));
    let wx=side===0?P.y+perp*rdy:P.x+perp*rdx;wx-=Math.floor(wx);let tx=(wx*64)|0;if(side===0&&rdx>0)tx=63-tx;if(side===1&&rdy<0)tx=63-tx;
    const T=texFor(c,mx,my),sh=side?.74:1,aw=amb/(1+perp*.45)*sh,fw=fl*1.75/(1+perp*perp*.1)*sh;
    for(let y=y0;y<=y1;y++){const ty=(((y-ds)/lineH)*64)&63,id=(ty<<6)|tx,i=y*RW+x;put(i,T.r[id],T.g[id],T.b[id],aw,fw*cone[i]);}
  }
  // sprites
  const sp=[];for(const d of desks)sp.push(d);
  for(const it of items)if(!it.taken)sp.push({x:it.x,y:it.y,tex:it.kind==='fuse'?'fuseItem':it.kind,h:.24,lift:it.kind==='mio'?.05+Math.sin(game.t*2)*.03:0,glow:it.kind==='key'?.55:it.kind==='mio'?.6:.3});
  sp.push({x:M.x,y:M.y,tex:M.state==='chase'&&Math.sin(game.t*14)>0?'oni1':'oni0',h:1.02,lift:0,oni:true});
  if(game.ghost)sp.push({x:game.ghost.x,y:game.ghost.y,tex:'girl',h:.62,lift:0,glow:.35});
  for(const s of sp)s.d=(s.x-P.x)**2+(s.y-P.y)**2;sp.sort((a,b)=>b.d-a.d);
  const invDet=1/(plX*dirY-dirX*plY);
  for(const s of sp){
    const sx=s.x-P.x,sy=s.y-P.y,tX=invDet*(dirY*sx-dirX*sy),tY=invDet*(-plY*sx+plX*sy);if(tY<.12)continue;
    const T=TX[s.tex],scr=(RW/2)*(1+tX/tY),shh=F/tY*s.h,sw=shh*T.w/T.h,bottom=hor+.5*F/tY-(s.lift||0)*F/tY,top=bottom-shh;
    const x0=Math.max(0,Math.floor(scr-sw/2)),x1=Math.min(RW-1,Math.floor(scr+sw/2)),y0=Math.max(0,Math.floor(top)),y1=Math.min(RH-1,Math.floor(bottom));
    const glow=s.glow||0,aw=amb/(1+tY*.45)+glow,fw=fl*1.75/(1+tY*tY*.1);
    for(let x=x0;x<=x1;x++){if(tY>=zbuf[x])continue;const tx=Math.min(T.w-1,((x-(scr-sw/2))/sw*T.w)|0);
      for(let y=y0;y<=y1;y++){const ty=Math.min(T.h-1,((y-top)/shh*T.h)|0),id=ty*T.w+tx;if(T.a[id]<128)continue;const i=y*RW+x;
        if(T.e[id]){buf[i]=0xff000000|(40<<16)|(50<<8)|255;continue;}put(i,T.r[id],T.g[id],T.b[id],aw,fw*cone[i]);}}
  }
  ctx.putImageData(img,0,0);
  ctx.fillStyle=vign;ctx.fillRect(0,0,RW,RH);
  if(P.hidden){ctx.fillStyle='rgba(8,10,9,.92)';const gap=RH/10;for(let i=0;i<10;i++)ctx.fillRect(0,i*gap,RW,gap*.6);ctx.fillRect(0,0,RW*.12,RH);ctx.fillRect(RW*.88,0,RW*.12,RH);}
  const d=game.near;if(d<6&&!game.paused){const a=(1-d/6)*(.5+.15*Math.sin(game.t*8));const v=ctx.createRadialGradient(RW/2,RH/2,Math.min(RW,RH)*.25,RW/2,RH/2,Math.max(RW,RH)*.7);v.addColorStop(0,'rgba(163,34,28,0)');v.addColorStop(1,`rgba(163,34,28,${a})`);ctx.fillStyle=v;ctx.fillRect(0,0,RW,RH);}
}
function put(i,r,g,b,a,f){const n=grainT[(i+gOff)&4095];let R=r*(a*.55+f)+n,G=g*(a*.72+f*.9)+n,B=b*(a*1.05+f*.7)+n;
  R=R<0?0:R>255?255:R;G=G<0?0:G>255?255:G;B=B<0?0:B>255?255:B;buf[i]=0xff000000|((B|0)<<16)|((G|0)<<8)|(R|0);}

const mc=$('#map'),mctx=mc.getContext('2d');
function drawMap(){
  const s=Math.floor(Math.min(mc.width/MW,mc.height/MH)),ox=(mc.width-s*MW)/2,oy=(mc.height-s*MH)/2;
  mctx.clearRect(0,0,mc.width,mc.height);
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){if(!explored[y*MW+x])continue;const c=grid[y][x];
    mctx.fillStyle=c==='.'||c==='T'?'#2a2724':c==='d'?'#4a3420':c==='D'?'#6b4a2e':S.locks[c]?'#c9a85a':c==='X'?'#a3221c':c==='L'?'#4d5a52':c==='F'?'#d8c040':'#77746a';
    mctx.fillRect(ox+x*s,oy+y*s,s,s);}
  const px=ox+P.x*s,py=oy+P.y*s;mctx.fillStyle='#d9d6cc';mctx.beginPath();mctx.moveTo(px+Math.cos(P.a)*s*1.2,py+Math.sin(P.a)*s*1.2);mctx.lineTo(px+Math.cos(P.a+2.4)*s*.8,py+Math.sin(P.a+2.4)*s*.8);mctx.lineTo(px+Math.cos(P.a-2.4)*s*.8,py+Math.sin(P.a-2.4)*s*.8);mctx.fill();
}
function objective(){
  if(stageIdx===0){if(!inv.music)return '音楽室の鍵を探す';if(!flags.staffOpen)return flags.readCode?'職員室の電子錠を開ける（4桁）':'音楽室を調べる';if(!inv.stair)return '職員室を調べる';return '防火扉から二階へ';}
  if(stageIdx===1){if(inv.fuse<3)return `ヒューズを探す（${inv.fuse}/3）`;if(!flags.power)return '廊下の配電盤にヒューズをはめる';return '東の渡り廊下の扉へ';}
  if(!inv.store)return '体育倉庫の鍵を探す';if(!inv.back)return '体育倉庫を調べる';return '西の裏口から外へ';}
let hudT=0;
function hud(){
  $('#obj').textContent=objective();$('#bat').textContent=Math.ceil(P.bat);$('#mio').textContent=inv.mio;
  $('#stam').style.width=(P.stam*100)+'%';$('#stamBox').classList.toggle('low',P.stam<.25);
  $('#lightBtn').classList.toggle('active',P.light);
  const t=target();$('#prompt').textContent=t?'調べる：'+t.label:'';$('#actBtn').classList.toggle('active',!!t);
  const chips=[];const names={music:'音楽室の鍵',stair:'防火扉の鍵',store:'体育倉庫の鍵',back:'裏口の鍵'};for(const k in names)if(inv[k])chips.push(names[k]);if(inv.fuse)chips.push('ヒューズ ×'+inv.fuse);
  $('#inv').innerHTML=chips.map(c=>`<span>${c}</span>`).join('');
  if(mapOn)drawMap();
}

/* =========================================================
   LOOP & FLOW
   ========================================================= */
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(game&&!game.paused&&!game.over){game.t+=dt;updatePlayer(dt);updateOni(dt);game.shake=Math.max(0,game.shake-dt);game.flicker=Math.max(0,game.flicker-dt);game.flash=Math.max(0,game.flash-dt*.8);
    game.whisperT-=dt;if(game.whisperT<=0){game.whisperT=16+Math.random()*12;if(M.state!=='chase')whisper(['もういいかい……','まぁだだよ……','いーち、にーい……','どこに いるの','おねえちゃん？'][Math.floor(Math.random()*5)]);}
    if(A)A.droneGain.gain.value=.05+(M.state==='chase'?.1:0);
    hudT-=dt;if(hudT<=0){hudT=.1;hud();}}
  if(game)render();requestAnimationFrame(frame);}

function jumpscare(cb){
  const s=$('#scare'),dp=Math.min(2,devicePixelRatio||1);s.width=innerWidth*dp;s.height=innerHeight*dp;s.classList.add('on');
  const c=s.getContext('2d'),w=s.width,h=s.height,dur=reduceMotion?900:1700,t0=performance.now();
  noise(1.6,1,500);blip(140,1.6,.45,'sawtooth',45);blip(97,1.6,.35,'square',40);blip(1200,.5,.08,'sawtooth',900);
  (function fr(now){
    const k=Math.min(1,(now-t0)/dur);c.setTransform(1,0,0,1,0,0);
    let g=c.createRadialGradient(w/2,h/2,0,w/2,h/2,Math.max(w,h)*.7);g.addColorStop(0,'#2a0403');g.addColorStop(1,'#000');c.fillStyle=g;c.fillRect(0,0,w,h);
    const zoom=reduceMotion?1.05:(k<.1?.3+k/.1*.85:1.15+(k-.1)*.3);
    const R=Math.min(w*.7,h*.5)*zoom,sh=reduceMotion?0:R*.05*(1-k*.6),ox=(Math.random()-.5)*sh,oy=(Math.random()-.5)*sh;
    drawFace(c,w/2+ox,h*.47+oy,R,{open:reduceMotion?1:.75+.25*Math.sin(now/40),t:now/1000,red:true});
    if(!reduceMotion){for(let i=0;i<6;i++)if(Math.random()<.45){const y=Math.random()*h,hh=h*(.015+Math.random()*.06);c.drawImage(s,0,y,w,hh,(Math.random()-.5)*w*.1,y,w,hh);}
      c.fillStyle='rgba(255,255,255,.05)';for(let i=0;i<400;i++)c.fillRect(Math.random()*w,Math.random()*h,2*dp,2*dp);
      if(Math.random()<.12){c.fillStyle='rgba(163,20,14,.4)';c.fillRect(0,0,w,h);}}
    if(k>.4){c.font=`${Math.round(Math.min(w,h)*.12)}px "Yuji Syuku",serif`;c.textAlign='center';c.textBaseline='bottom';c.shadowColor='#000';c.shadowBlur=20*dp;c.fillStyle='#d4180f';c.fillText('みぃつけた',w/2+ox*.4,h-24*dp);c.shadowBlur=0;}
    if(k<1)requestAnimationFrame(fr);else setTimeout(()=>{s.classList.remove('on');cb();},250);
  })(t0);
}
function caught(locker){
  game.over=true;game.paused=true;keys.clear();joy=null;look=null;
  jumpscare(()=>{overlay(`<p class="big red">「みぃつけた。」</p><p>${locker?'ロッカーに入るところを、見られていた。':'あなたは、おにさんに見つかった。'}</p><p class="tapnote">${S.title}　／　遺品 ${inv.mio} / 3</p>
    <div class="row"><button class="go red" id="retry">チェックポイントから</button><button class="go" id="restart">はじめから</button></div>`);
    $('#retry').onclick=()=>{loadCheckpoint();closeOv();whisper('もう いっかい');};
    $('#restart').onclick=()=>{inv={mio:0};loadStage(0,false);closeOv();game.paused=false;M.state='dormant';};});
}
function chapter(i,then){const s=STAGES[i];overlay(`<div class="kicker">STAGE ${i+1} / 3</div><h2>${s.title}</h2><p class="tapnote">${s.sub||'　'}</p><div class="tapnote">タップではじめる ▸</div>`,()=>{closeOv();then&&then();});}
function stageClear(){
  game.over=true;game.paused=true;
  if(stageIdx===0)pages(['<p class="big">防火扉の向こうは、二階へ続く階段だった。</p>','<p>踊り場の鏡に、一瞬だけ、\nおかっぱ頭の後ろ姿が映った。</p><p class="big">「こっちだよ、おねえちゃん」</p>','<p>階段の下で、扉がゆっくり閉まる音がした。\nおにさんも、のぼってくる。</p>'],()=>{loadStage(1,true);chapter(1,()=>{game.paused=false;game.dormantT=5;});});
  else if(stageIdx===1)pages(['<p class="big">渡り廊下の先に、\n体育館の灯りがひとつだけ点いていた。</p>','<p>七年前のあの日。\nかくれんぼをしたのは、ここだった。</p><p class="big red">「……きゅう、じゅう。もういいかい」</p>'],()=>{loadStage(2,true);chapter(2,()=>{game.paused=false;game.dormantT=4;});});
  else ending();
}
function ending(){
  const all=inv.mio>=3;
  const common=['<p class="big">鍵がまわり、鎖がほどけた。\n夜風が吹きこむ。外だ——。</p>','<p class="big">「おねえちゃん」</p><p>背中で、聞きなれた声がした。</p>'];
  if(all)pages(common.concat([
    '<p>振り返ると、ミオが立っていた。\n七年前と同じ服で、同じ背たけで。</p>',
    '<p class="big">「ヘアピンも、絵も、名札も。\n　ぜんぶ みつけてくれたんだね」</p>',
    '<p>「おにさんはね、だれにも みつけてもらえなかった子が なるの。\n　わたし、ずっと ひとりで かぞえてた」</p>',
    '<p class="big">「でも、もう だいじょうぶ」</p><p>ミオはヘアピンを髪にとめて、笑った。</p>',
    '<p class="big">「みーつけた。\n　……これで、かくれんぼ おしまい」</p>',
    '<p>小さな手が、朝の光に溶けていった。\n校舎の奥で、数える声はもう聞こえなかった。</p>'
  ]),()=>endCard('TRUE END','もういいよ','ミオは、やっと見つけてもらえた。'));
  else pages(common.concat([
    '<p>振り返ると、昇降口の暗がりに、\n七年前と同じ服のミオが立っていた。</p>',
    '<p class="big">「わたしの、ぜんぶは みつけてくれなかったね」</p>',
    '<p class="big red">「じゃあ——つぎは、おねえちゃんが、おにね。」</p>'
  ]),()=>endCard('END','まぁだだよ',`ミオの遺品 ${inv.mio} / 3 ── 全部見つけると、別の結末が待っている。`));
}
function endCard(k,t,s){overlay(`<div class="kicker">${k}</div><h1>${t.slice(0,-2)}<span>${t.slice(-2)}</span></h1><p>${s}</p><div class="row"><button class="go" id="again">はじめから</button></div>`);
  $('#again').onclick=()=>{inv={mio:0};loadStage(0,false);intro();};}

function intro(){
  pages([
    '<p class="big">七年前の夏。\n旧校舎でかくれんぼをしていた妹のミオは、\nそのまま帰ってこなかった。</p>',
    '<p>今夜、知らない番号から電話が鳴った。\n受話器の向こうで、ミオの声がした。</p><p class="big">「おねえちゃん、まだ みつけてくれないの？」</p>',
    '<p>気がつくと、旧校舎の廊下に立っていた。\n昇降口は外から鎖で閉ざされている。\nどこかで、だれかが数えている。</p><p class="big red">「いーち、にーい、さーん……」</p>'
  ],()=>{overlay(`<div class="kicker">あそびかた</div>
    <dl class="ctrl"><dt>移動</dt><dd>画面の左半分をドラッグ／WASD</dd>
    <dt>見回す</dt><dd>画面の右半分をドラッグ／マウスドラッグ・←→</dd>
    <dt>走る</dt><dd>「走る」を長押し／Shift。足音でおにさんに気づかれる</dd>
    <dt>調べる</dt><dd>扉・ロッカー・黒板など。ロッカーに隠れられる</dd>
    <dt>ライト</dt><dd>明るいけれど、遠くからも見つかる。電池は有限</dd></dl>
    <p>全3ステージ。<span class="red">白い顔のおにさんに捕まったら終わり。</span>\nミオの遺品を3つ集めると……。</p>
    <div class="row"><button class="go red" id="go">はじめる</button></div>`);
    $('#go').onclick=()=>chapter(0,()=>{game.paused=false;});});
}
function title(){
  overlay(`<div class="kicker">旧校舎ホラー　／　全3ステージ　／　音あり推奨</div><h1>もういい<span>かい</span></h1><p>七年前に消えた妹。夜の旧校舎で、"おにさん"から逃げきれ。</p><div class="row"><button class="go" id="t1">はじめる</button></div>`);
  $('#t1').onclick=()=>{audioInit();intro();};
}

buildTextures();loadStage(0,false);resize();title();requestAnimationFrame(frame);
})();
</script>
